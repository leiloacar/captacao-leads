<meta charset="UTF-8">

<title>Vaga garantida — Leiloacar</title>

<style>
  :root {
    --color-primary: #124C82;
    --color-accent: #FF6600;
    --color-accent-light: #FF8A33;
    --color-text: #0F1F2E;
    --color-text-muted: #69788C;
    --color-border: #DFE5EC;
    --font-body: 'Inter', sans-serif;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(160deg, #124C82, #0F1F2E 80%);
    color: var(--color-text);
    font-family: var(--font-body);
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
  }

  .card {
    max-width: 480px;
    width: 100%;
    background: #fff;
    border-radius: var(--radius);
    padding: 2.75rem 2rem;
    text-align: center;
    box-shadow: 0 24px 60px rgb(0 0 0 / .35);
  }

  .card img { height: 26px; margin: 0 auto 1.75rem; }

  .check {
    width: 60px; height: 60px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background: rgb(255 102 0 / .1);
    display: grid;
    place-items: center;
    color: var(--color-accent);
  }

  h1 {
    font-weight: 900;
    font-size: clamp(1.4rem, 4vw, 1.85rem);
    line-height: 1.25;
    margin-bottom: 1rem;
    color: var(--color-primary);
  }
  .accent { color: var(--color-accent); }

  p { color: var(--color-text-muted); margin-bottom: 0.75rem; font-size: 0.95rem; }

  .perk-box {
    margin-top: 1.5rem;
    background: linear-gradient(135deg, rgb(255 138 51 / .12), rgb(255 102 0 / .05));
    border: 1px solid rgb(255 138 51 / .3);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .perk-box .icon {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border-radius: 8px;
    background: var(--color-accent);
    display: grid;
    place-items: center;
    color: #fff;
  }
  .perk-box span { display: block; color: var(--color-text); font-size: 0.86rem; margin: 0; }
  .perk-box strong { color: var(--color-primary); }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <main class="card">
    <img src="assets/logo_small.png" alt="Leiloacar">
    <div class="check">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Vaga garantida <span class="accent">com sucesso!</span></h1>
    <p>Você está entre os primeiros a garantir acesso exclusivo à Leiloacar.</p>
    <p>Fique de olho no seu e-mail e WhatsApp — em breve enviaremos os próximos passos do lançamento.</p>

    <div class="perk-box">
      <div class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6M2 7h20M12 22V7M12 7a2.5 2.5 0 1 1 2.5-2.5C14.5 6 12 7 12 7ZM12 7a2.5 2.5 0 1 0-2.5-2.5C9.5 6 12 7 12 7Z"/></svg>
      </div>
      <span><strong>Seus 3 anúncios grátis</strong> já estão reservados e serão liberados assim que a plataforma entrar no ar.</span>
    </div>
  </main>

<script>
  // Dispara o evento de conversão só na primeira visita pós-cadastro real
  // (via flag setado pelo index.html), nunca em refresh/acesso direto.
  if (sessionStorage.getItem('leiloacar_lead_submitted') === '1') {
    sessionStorage.removeItem('leiloacar_lead_submitted');
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'lead_submitted' });
  }
</script>

</body>
</html>
